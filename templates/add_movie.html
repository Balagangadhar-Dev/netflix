<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Add Movie</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }
        
        body{
            /* Keeping the same background as the auth pages */
            background:url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1500&q=80");
            background-size:cover;
            background-position:center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .overlay{
            width:100%;
            min-height:100vh;
            background:rgba(0,0,0,.75);
            display:flex;
            justify-content:center;
            align-items:center;
            padding: 40px 20px;
        }

        .add-box{
            width:100%;
            max-width: 500px; /* Slightly wider to accommodate more fields */
            background:rgba(0,0,0,.85);
            padding:45px;
            border-radius:8px;
        }

        .logo{
            color:#E50914;
            font-size:42px;
            font-weight:bold;
            letter-spacing:2px;
            margin-bottom:30px;
            text-align:center;
        }

        h2{
            color:white;
            margin-bottom:25px;
            text-align:center;
        }

        /* Targeting Django's auto-generated form inputs */
        input, textarea, select {
            width:100%;
            padding:15px;
            margin-bottom:15px;
            background:#333;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            outline:none;
        }

        input::placeholder, textarea::placeholder {
            color:#bbb;
        }

        label {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 5px;
            display: inline-block;
            font-weight: bold;
        }

        .helptext {
            color: #888;
            font-size: 12px;
            display: block;
            margin-bottom: 10px;
        }

        button{
            width:100%;
            padding:15px;
            background:#E50914;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
            margin-top: 15px;
        }

        button:hover{
            background:#c40812;
        }

        p.back-link {
            margin-top:20px;
            text-align:center;
        }

        a {
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        a:hover {
            text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="add-box">
        <div class="logo">NETFLIX</div>
        <h2>Add a New Movie</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Movie</button>
        </form>

        <p class="back-link">
            <a href="{% url 'home' %}">Cancel & Back to Home</a>
        </p>
    </div>
</div>

</body>
</html>
