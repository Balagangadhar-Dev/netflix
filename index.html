<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVault - Gear for Developers</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    /* Promo Banner */
    #promo-banner { background: linear-gradient(90deg, #4f46e5, #06b6d4); color: white; text-align: center; padding: 10px; font-weight: bold; position: relative; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border); }
    #store-title { color: var(--accent); font-size: 1.8rem; }
    .nav-tools { display: flex; gap: 15px; align-items: center; }
    #search-input { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: #020617; color: white; width: 220px; }
    .cart-btn { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Product Grid */
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .product-card:hover { border-color: var(--accent); }
    .product-title { font-size: 1.2rem; margin-bottom: 8px; }
    .price { font-size: 1.4rem; color: var(--success); font-weight: bold; margin: 10px 0; }
    .btn-buy { background: var(--border); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    
    /* Custom Dynamic Styling Target */
    .highlighted-card { outline: 3px solid #f59e0b; background-color: #292524 !important; transform: translateY(-5px); }

    /* Nesting section for event bubbling demo */
    #nested-demo-outer { background: #312e81; padding: 25px; border-radius: 12px; margin-top: 40px; }
    #nested-demo-inner { background: #4338ca; padding: 20px; border-radius: 8px; text-align: center; }
    #nested-btn { background: #06b6d4; color: black; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="promo-banner">🎉 FLASH SALE: Use code <code>DOM2026</code> for 50% off today only!</div>

  <header>
    <h1 id="store-title">TechVault</h1>
    <div class="nav-tools">
      <input type="text" id="search-input" placeholder="Search gadgets...">
      <button class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <h2>Featured Products</h2>
    
    <div class="grid" id="product-grid">
      <div class="product-card" id="prod-1" data-category="hardware">
        <div>
          <h3 class="product-title">Mechanical Keyboard</h3>
          <p style="color: var(--text-muted);">Hot-swappable RGB Switches</p>
        </div>
        <div>
          <div class="price">$120</div>
          <button class="btn-buy">Add to Cart</button>
        </div>
      </div>

      <div class="product-card" id="prod-2" data-category="accessories">
        <div>
          <h3 class="product-title">Noise-Canceling Headphones</h3>
          <p style="color: var(--text-muted);">40hr Battery Life</p>
        </div>
        <div>
          <div class="price">$250</div>
          <button class="btn-buy">Add to Cart</button>
        </div>
      </div>

      <div class="product-card" id="prod-3" data-category="monitors">
        <div>
          <h3 class="product-title">4K UltraWide Monitor</h3>
          <p style="color: var(--text-muted);">144Hz Refresh Rate</p>
        </div>
        <div>
          <div class="price">$600</div>
          <button class="btn-buy">Add to Cart</button>
        </div>
      </div>
    </div>

    <!-- Event Propagation Container -->
    <div id="nested-demo-outer">
      <h3>Event Flow Playground (Outer Container)</h3>
      <div id="nested-demo-inner">
        <p>Inner Wrapper</p>
        <button id="nested-btn">Target Button</button>
      </div>
    </div>
  </main>

</body>
</html>
